<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 10px; overflow: hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Scanner Line Gradient -->
    <linearGradient id="scan-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0)" />
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.25)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0)" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(300px); }
    }
    @keyframes pulse-node {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes border-glow {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .scan-line { animation: scan 6s linear infinite; }
    .node-pulse { animation: pulse-node 3s ease-in-out infinite; transform-origin: center; }
    .floating-pill { animation: float-pill 4s ease-in-out infinite; }
    .border-glow-path { animation: border-glow 4s ease-in-out infinite; }
  </style>

  <!-- Base Layer Background -->
  <rect width="900" height="260" fill="url(#bg-gradient)" />

  <!-- Animated Grid Pattern Background -->
  <g opacity="0.08">
    <path d="M0 40 H900 M0 80 H900 M0 120 H900 M0 160 H900 M0 200 H900 M0 240 H900" stroke="#94a3b8" stroke-width="1" />
    <path d="M100 0 V260 M200 0 V260 M300 0 V260 M400 0 V260 M500 0 V260 M600 0 V260 M700 0 V260 M800 0 V260" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Background Scanning Effect -->
  <rect class="scan-line" x="0" y="0" width="900" height="80" fill="url(#scan-gradient)" pointer-events="none" />

  <!-- Background Dynamic Network Nodes & Dynamic Graphics (Behind Text) -->
  <g opacity="0.4">
    <!-- Connecting Cyber Threat Lines -->
    <path d="M 50 190 Q 200 130 350 200 T 700 160 T 850 210" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,6" />
    <path d="M 100 70 Q 300 150 550 60 T 800 100" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Animated Nodes -->
    <circle class="node-pulse" cx="120" cy="180" r="16" fill="#8b5cf6" filter="url(#glow)" />
    <circle class="node-pulse" cx="780" cy="80" r="20" fill="#6366f1" filter="url(#glow)" />
    <circle class="node-pulse" cx="680" cy="200" r="12" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Outer Dynamic Accent Border Frame -->
  <rect class="border-glow-path" x="4" y="4" width="892" height="252" rx="8" fill="none" stroke="url(#accent-glow)" stroke-width="2" />

  <!-- Dynamic Accent Pills (In Background Layer Behind Main Headings) -->
  <g class="floating-pill" opacity="0.85">
    <!-- Tag 1: BEC Detection -->
    <rect x="50" y="195" width="130" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <text x="115" y="214" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">🛡️ BEC Detection</text>

    <!-- Tag 2: Phishing Triage -->
    <rect x="190" y="195" width="135" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="257" y="214" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">🎣 Phishing Triage</text>

    <!-- Tag 3: Header Forensics -->
    <rect x="335" y="195" width="145" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
    <text x="407" y="214" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">🔍 Header Forensics</text>

    <!-- Tag 4: IOC Extraction -->
    <rect x="490" y="195" width="135" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="557" y="214" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">⚡ IOC Extraction</text>
  </g>

  <!-- FOREGROUND LAYER: Title and Subtitle ALWAYS in Foreground -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <!-- Main Title Glow Shadow -->
    <text x="0" y="0" font-size="34" font-weight="800" fill="#000" opacity="0.5" dy="2">Awesome Email Threat Analysis</text>
    
    <!-- Main Title -->
    <text x="0" y="0" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Email Threat Analysis
    </text>

    <!-- Subtitle -->
    <text x="0" y="38" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of Enterprise SaaS &amp; Open-Source Security Solutions
    </text>

    <!-- Ecosystem Badge -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">
        • SOC TRIAGE • BEC DEFENSE • EMAIL FORENSICS • IOC ENRICHMENT •
      </text>
    </g>
  </g>
</svg>
